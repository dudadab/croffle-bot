name: Secret Scan

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: trufflesecurity/trufflehog@v3.97.0
        with:
          extra_args: --results=verified,unknown
          version: '3.97.0'
